<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0b0720; --bg2:#1d1146; --pink:#ff5fa2; --gold:#ffd166; --violet:#9b6bff; --cyan:#5ee7ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg1);font-family:'Cairo',sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
body::before{
  content:"";position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(60vmax 60vmax at 15% 20%,rgba(155,107,255,.35),transparent 60%),
    radial-gradient(55vmax 55vmax at 85% 80%,rgba(255,95,162,.30),transparent 60%),
    radial-gradient(40vmax 40vmax at 70% 10%,rgba(94,231,255,.18),transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  animation:bgshift 18s ease-in-out infinite alternate;
}
@keyframes bgshift{from{filter:hue-rotate(0)}to{filter:hue-rotate(40deg)}}

/* ---------- نجوم الخلفية ---------- */
#stars{position:fixed;inset:0;z-index:1;pointer-events:none}

/* ---------- شاشة كلمة السر ---------- */
#lock{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;transition:opacity .9s ease, transform .9s ease, filter .9s ease;
}
#lock.out{opacity:0;transform:scale(1.15);filter:blur(10px);pointer-events:none}
.floaty{position:absolute;font-size:2rem;opacity:.55;animation:float 7s ease-in-out infinite;user-select:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.card{
  position:relative;width:min(92vw,440px);padding:38px 28px 30px;border-radius:30px;
  background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.18);box-shadow:0 20px 70px rgba(0,0,0,.45), inset 0 0 40px rgba(255,255,255,.04);
  animation:cardIn 1.1s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:none}}
.lockicon{font-size:3.2rem;display:inline-block;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.card h1{font-size:2rem;font-weight:900;margin:10px 0 6px;background:linear-gradient(90deg,var(--gold),var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hint{font-size:1.08rem;font-weight:600;color:#ffe9b8;margin:6px 0 20px;opacity:.95}
.field{display:flex;gap:10px;direction:ltr}
.field input{
  flex:1;min-width:0;padding:15px 16px;border-radius:16px;border:2px solid rgba(255,255,255,.2);outline:none;
  background:rgba(0,0,0,.28);color:#fff;font-size:1.3rem;text-align:center;letter-spacing:4px;font-family:inherit;transition:.25s;
}
.field input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,95,162,.2)}
.field button{
  padding:0 22px;border:none;border-radius:16px;cursor:pointer;font-size:1.5rem;color:#fff;
  background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 8px 24px rgba(255,95,162,.4);transition:transform .2s;
}
.field button:active{transform:scale(.92)}
.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
#msgwrong{min-height:26px;margin-top:14px;font-weight:700;color:#ff9db8;transition:.3s}
#reveal{
  margin-top:8px;min-height:56px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;
  opacity:0;transform:translateY(14px) scale(.9);transition:all .9s cubic-bezier(.2,.9,.3,1.3);
}
#reveal.show{opacity:1;transform:none}
#reveal small{opacity:.75;font-size:.9rem}
#pw{
  font-size:2.3rem;font-weight:900;letter-spacing:6px;direction:ltr;cursor:pointer;color:var(--gold);
  text-shadow:0 0 18px rgba(255,209,102,.7);animation:glow 1.6s ease-in-out infinite alternate;
}
@keyframes glow{from{text-shadow:0 0 8px rgba(255,209,102,.4)}to{text-shadow:0 0 26px rgba(255,209,102,.95)}}

/* ---------- المشهد الرئيسي ---------- */
#scene{position:fixed;inset:0;z-index:20;display:none;overflow:hidden}
#scene.on{display:block}
#fx{position:fixed;inset:0;z-index:30;pointer-events:none}
#balloons{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}
.balloon{
  position:absolute;bottom:-140px;width:58px;height:74px;border-radius:50% 50% 48% 48%;
  animation:rise linear forwards;box-shadow:inset -8px -10px 18px rgba(0,0,0,.18), inset 8px 8px 14px rgba(255,255,255,.35);
}
.balloon::after{content:"";position:absolute;left:50%;bottom:-8px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.balloon i{position:absolute;left:50%;top:100%;width:1.5px;height:70px;background:rgba(255,255,255,.5);transform-origin:top;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(6deg)}to{transform:rotate(-6deg)}}
@keyframes rise{to{transform:translateY(-125vh) translateX(var(--dx))}}

#title{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;z-index:28;
  transition:all 1.3s cubic-bezier(.7,0,.2,1);
}
#title.up{top:11%;transform:translateY(-50%) scale(.55)}
#title .en{font-family:'Pacifico',cursive;font-size:clamp(2.6rem,11vw,7rem);line-height:1.15;display:block}
#title .en span{
  display:inline-block;opacity:0;transform:translateY(-120vh) rotate(-30deg);
  background:linear-gradient(180deg,#fff,var(--gold) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 22px rgba(255,95,162,.55));
}
#title .en span.in{animation:drop 1.1s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes drop{0%{opacity:0;transform:translateY(-120vh) rotate(-30deg)}70%{opacity:1}100%{opacity:1;transform:none}}
#title .ar{display:block;margin-top:10px;font-size:clamp(1.3rem,5vw,2.4rem);font-weight:800;color:#ffe9b8;opacity:0;transition:opacity 1s .9s}
#title.shown .ar{opacity:1}

/* مسرح الصور */
#cinema{position:absolute;inset:0;z-index:26;display:flex;align-items:center;justify-content:center;pointer-events:none}
.shot{
  position:absolute;width:min(78vw,460px);aspect-ratio:4/5;max-height:70vh;border-radius:22px;overflow:hidden;
  border:6px solid #fff;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(255,95,162,.35);background:#222;
  opacity:0;will-change:transform,opacity;
}
.shot img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 4.2s ease-out forwards}
@keyframes kb{from{transform:scale(1.18) translate(2%,2%)}to{transform:scale(1) translate(0,0)}}
.shot .tag{
  position:absolute;bottom:12px;inset-inline:0;margin:auto;width:max-content;padding:6px 20px;border-radius:30px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);font-weight:800;font-size:1.1rem;letter-spacing:1px;
}
.shot .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;
  background:linear-gradient(135deg,var(--violet),var(--pink))}
.from-right{animation:inR 3.5s cubic-bezier(.2,.8,.2,1) forwards}
.from-left{animation:inL 3.5s cubic-bezier(.2,.8,.2,1) forwards}
.from-top{animation:inT 3.5s cubic-bezier(.2,.8,.2,1) forwards}
.from-bottom{animation:inB 3.5s cubic-bezier(.2,.8,.2,1) forwards}
.from-zoom{animation:inZ 3.5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes inR{0%{opacity:0;transform:translateX(120vw) rotate(14deg)}16%{opacity:1;transform:rotate(-3deg)}84%{opacity:1;transform:rotate(2deg) scale(1.03)}100%{opacity:0;transform:translateX(-120vw) rotate(-14deg)}}
@keyframes inL{0%{opacity:0;transform:translateX(-120vw) rotate(-14deg)}16%{opacity:1;transform:rotate(3deg)}84%{opacity:1;transform:rotate(-2deg) scale(1.03)}100%{opacity:0;transform:translateX(120vw) rotate(14deg)}}
@keyframes inT{0%{opacity:0;transform:translateY(-120vh) rotate(-10deg)}16%{opacity:1;transform:rotate(2deg)}84%{opacity:1;transform:rotate(-2deg) scale(1.03)}100%{opacity:0;transform:translateY(120vh) rotate(10deg)}}
@keyframes inB{0%{opacity:0;transform:translateY(120vh) rotate(10deg)}16%{opacity:1;transform:rotate(-2deg)}84%{opacity:1;transform:rotate(2deg) scale(1.03)}100%{opacity:0;transform:translateY(-120vh) rotate(-10deg)}}
@keyframes inZ{0%{opacity:0;transform:scale(.1) rotate(-180deg)}16%{opacity:1;transform:scale(1) rotate(0)}84%{opacity:1;transform:scale(1.06)}100%{opacity:0;transform:scale(2.6) rotate(20deg)}}

/* الختام: المعرض + الرسالة */
#finale{
  position:absolute;inset:0;z-index:27;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:0 16px 3vh;gap:2.2vh;opacity:0;pointer-events:none;transition:opacity 1.2s;
}
#finale.on{opacity:1;pointer-events:auto}
#gallery{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;max-width:1000px}
.thumb{
  width:clamp(74px,15vw,150px);aspect-ratio:4/5;border-radius:14px;overflow:hidden;border:4px solid #fff;position:relative;
  box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(60px) scale(.6) rotate(var(--r));
}
#finale.on .thumb{animation:thumbIn .9s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:calc(var(--i)*.22s)}
@keyframes thumbIn{to{opacity:1;transform:rotate(var(--r))}}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;text-align:center;background:linear-gradient(135deg,var(--violet),var(--pink))}
.thumb b{position:absolute;bottom:4px;inset-inline:0;margin:auto;width:max-content;font-size:.7rem;background:rgba(0,0,0,.6);padding:2px 9px;border-radius:20px}
#message{
  width:min(94vw,720px);padding:22px 24px;border-radius:26px;text-align:center;
  background:rgba(255,255,255,.1);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.25);box-shadow:0 20px 60px rgba(0,0,0,.4);
  font-size:clamp(1.05rem,3.4vw,1.55rem);font-weight:700;line-height:1.9;
}
#message .line{display:block;opacity:0;transform:translateY(18px);filter:blur(6px);transition:all .9s ease}
#message .line.in{opacity:1;transform:none;filter:none}
#message .line:first-child{font-size:1.25em;font-weight:900;color:var(--gold)}
#message .heart{display:inline-block;animation:pulse 1.4s infinite}

#sound{
  position:fixed;top:14px;left:14px;z-index:60;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);backdrop-filter:blur(8px);color:#fff;font-size:1.3rem;cursor:pointer;display:none
}
#sound.on{display:block}
#ytwrap{position:fixed;width:2px;height:2px;left:-10px;top:-10px;opacity:.01;overflow:hidden;pointer-events:none}
@media (max-height:620px){#title.up{top:9%}.thumb{width:clamp(60px,12vw,110px)}}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="ytwrap"><div id="yt"></div></div>

<!-- ================= شاشة كلمة السر ================= -->
<div id="lock">
  <span class="floaty" style="top:12%;left:10%">✨</span>
  <span class="floaty" style="top:20%;right:12%;animation-delay:-2s">💫</span>
  <span class="floaty" style="bottom:16%;left:14%;animation-delay:-4s">🌸</span>
  <span class="floaty" style="bottom:12%;right:10%;animation-delay:-1s">🎈</span>
  <span class="floaty" style="top:48%;left:5%;animation-delay:-3s">💖</span>
  <span class="floaty" style="top:55%;right:6%;animation-delay:-5s">🌟</span>

  <div class="card" id="card">
    <div class="lockicon">🔐</div>
    <h1>خمّن كلمة السر</h1>
    <div class="hint">تلميح: كلمة السر هي عيد ميلادك 💭</div>
    <form class="field" id="form" autocomplete="off">
      <input id="inp" type="text" inputmode="numeric" placeholder="••-••" maxlength="5" autocomplete="off">
      <button type="submit" aria-label="دخول">➜</button>
    </form>
    <div id="msgwrong"></div>
    <div id="reveal"><small>كلمة السر هي</small><div id="pw">24-10</div></div>
  </div>
</div>

<!-- ================= المشهد ================= -->
<div id="scene">
  <div id="balloons"></div>
  <div id="title">
    <span class="en" id="enTitle"></span>
    <span class="ar">🎂 عيد ميلاد سعيد يا انجي 🎂</span>
  </div>
  <div id="cinema"></div>
  <div id="finale">
    <div id="gallery"></div>
    <div id="message">
      <span class="line"> كل سنة وانتي طيبة يا انجي 🎉</span>
      <span class="line">وعقبال مليون سنة حلوة معانا، ودايمًا في تقدّم 🌟</span>
      <span class="line">وعقبال مليون سنة حلوة مع يسوع ✝️</span>
      <span class="line">وكل سنة وانتي طيبة <span class="heart">💖</span></span>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>
<button id="sound" title="الصوت">🔊</button>

<script>
/* =====================================================
   إعدادات سهلة التعديل
   ===================================================== */
const CONFIG = {
  PASSWORD: "24-10",
  REVEAL_AFTER_MS: 25000,          // بعد كام ثانية تظهر كلمة السر
  YT_ID: "KbtwC_0Uh40",            // لينك الأغنية من اليوتيوب
  SHOT_MS: 3500,                   // مدة كل صورة
  IMAGE_NAMES: [1,2,3,4,5],        // لوجو 1 .. لوجو 5
  EXTS: ["png","jpg","jpeg","webp","PNG","JPG","JPEG"]
};

/* =====================================================
   نجوم الخلفية
   ===================================================== */
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');let W,H,S=[];
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight;S=Array.from({length:Math.min(140,W/8|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,p:Math.random()*6.28,s:Math.random()*.02+.005}))}
  addEventListener('resize',rs);rs();
  (function f(){x.clearRect(0,0,W,H);for(const s of S){s.p+=s.s;x.globalAlpha=.3+.7*Math.abs(Math.sin(s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()}requestAnimationFrame(f)})();
})();

/* =====================================================
   مشغّل اليوتيوب (loop)
   ===================================================== */
let ytPlayer=null, ytReady=false, wantPlay=false, muted=false;
(function(){
  const s=document.createElement('script');s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s);
})();
window.onYouTubeIframeAPIReady=function(){
  ytPlayer=new YT.Player('yt',{
    width:'200',height:'200',videoId:CONFIG.YT_ID,
    playerVars:{autoplay:0,controls:0,loop:1,playlist:CONFIG.YT_ID,playsinline:1,rel:0,modestbranding:1,disablekb:1,fs:0},
    events:{
      onReady:()=>{ytReady=true;if(wantPlay)startMusic()},
      onStateChange:e=>{ if(e.data===YT.PlayerState.ENDED){ytPlayer.seekTo(0);ytPlayer.playVideo()} }
    }
  });
};
function startMusic(){
  wantPlay=true;
  if(ytReady&&ytPlayer){try{ytPlayer.unMute();ytPlayer.setVolume(100);ytPlayer.playVideo()}catch(e){}}
}
const soundBtn=document.getElementById('sound');
soundBtn.onclick=()=>{
  if(!ytReady)return;muted=!muted;
  if(muted){ytPlayer.mute();soundBtn.textContent='🔇'}else{ytPlayer.unMute();ytPlayer.playVideo();soundBtn.textContent='🔊'}
};

/* =====================================================
   شاشة كلمة السر
   ===================================================== */
const inp=document.getElementById('inp'),form=document.getElementById('form'),
      wrong=document.getElementById('msgwrong'),card=document.getElementById('card'),
      reveal=document.getElementById('reveal'),pw=document.getElementById('pw');
let tries=0, unlocked=false;

function norm(v){return v.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d]/g,'')}
const target=norm(CONFIG.PASSWORD);

// تنسيق تلقائي 14-10
inp.addEventListener('input',()=>{
  let d=norm(inp.value).slice(0,4);
  inp.value=d.length>2?d.slice(0,2)+'-'+d.slice(2):d;
});

form.addEventListener('submit',e=>{
  e.preventDefault();
  if(unlocked)return;
  if(norm(inp.value)===target){unlock();return}
  tries++;
  card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
  wrong.textContent = tries===1
    ? "لأ مش دي 🙈 — كلمة السر هي عيد ميلادك، بالأرقام: يوم-شهر"
    : "قربت 😄 فكّر تاني.. عيد ميلادك بالأرقام (يوم-شهر)";
  inp.select();
});

// بعد 25 ثانية تظهر كلمة السر
setTimeout(()=>{ if(!unlocked) reveal.classList.add('show') }, CONFIG.REVEAL_AFTER_MS);
pw.addEventListener('click',()=>{inp.value=CONFIG.PASSWORD;inp.focus()});

/* =====================================================
   فتح المفاجأة
   ===================================================== */
function unlock(){
  unlocked=true;
  startMusic();                                   // داخل حدث نقر = المتصفح يسمح بالصوت
  document.getElementById('lock').classList.add('out');
  setTimeout(()=>{document.getElementById('lock').style.display='none'},950);
  const sc=document.getElementById('scene');sc.classList.add('on');
  soundBtn.classList.add('on');
  runShow();
}

/* ---------- عنوان Happy Birthday ---------- */
function buildTitle(){
  const t=document.getElementById('enTitle');t.innerHTML='';
  "Happy Birthday".split('').forEach(ch=>{
    const s=document.createElement('span');s.textContent=ch===' '?'\u00A0':ch;t.appendChild(s);
  });
  return [...t.children];
}

/* ---------- تحميل الصور بأي امتداد/اسم ---------- */
function candidates(n){
  const bases=[`logo${n}`,`logo ${n}`,`logo_${n}`,`لوجو ${n}`,`لوجو${n}`,`Logo${n}`,`Logo ${n}`];
  const out=[];bases.forEach(b=>CONFIG.EXTS.forEach(e=>out.push(`${b}.${e}`)));return out;
}
function loadImage(n){
  return new Promise(res=>{
    const list=candidates(n);let i=0;
    (function next(){
      if(i>=list.length)return res(null);
      const im=new Image();
      im.onload=()=>res(im.src);
      im.onerror=()=>{i++;next()};
      im.src=encodeURI(list[i]);
    })();
  });
}
let IMGS=[];
const imgPromise=Promise.all(CONFIG.IMAGE_NAMES.map(loadImage)).then(r=>IMGS=r);

/* =====================================================
   العرض الكامل
   ===================================================== */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function runShow(){
  const letters=buildTitle();
  const title=document.getElementById('title');

  startFX();
  // قنبلة الاحتفالات
  fireworkBurst(5);confettiRain(160);spawnBalloons(14);
  await sleep(350);

  // حروف Happy Birthday تنزل من السما
  letters.forEach((l,i)=>setTimeout(()=>l.classList.add('in'),i*90));
  await sleep(letters.length*90+700);
  title.classList.add('shown');
  fireworkBurst(4);
  await sleep(2600);

  title.classList.add('up');
  fireworkBurst(2);
  await sleep(1400);

  await imgPromise;
  await playPhotos();
  await showFinale();
}

/* ---------- الصور واحدة ورا التانية (زي فيديو) ---------- */
async function playPhotos(){
  const cinema=document.getElementById('cinema');
  const dirs=['from-right','from-left','from-top','from-bottom','from-zoom'];
  for(let i=0;i<CONFIG.IMAGE_NAMES.length;i++){
    const n=CONFIG.IMAGE_NAMES[i];
    const d=document.createElement('div');d.className='shot '+dirs[i%dirs.length];
    d.style.animationDuration=CONFIG.SHOT_MS+'ms';
    d.innerHTML=IMGS[i]?`<img src="${IMGS[i]}" alt="لوجو ${n}">`:`<div class="ph">لوجو ${n}</div>`;
    cinema.appendChild(d);
    setTimeout(()=>fireworkBurst(1),CONFIG.SHOT_MS*.2);
    if(i%2===0)confettiRain(50);
    await sleep(CONFIG.SHOT_MS-300);
    setTimeout(()=>d.remove(),700);
  }
  await sleep(600);
}

/* ---------- الختام: المعرض + الرسالة ---------- */
async function showFinale(){
  const g=document.getElementById('gallery');g.innerHTML='';
  const rots=[-6,4,-2,5,-5];
  CONFIG.IMAGE_NAMES.forEach((n,i)=>{
    const t=document.createElement('div');t.className='thumb';t.style.setProperty('--i',i);t.style.setProperty('--r',rots[i%5]+'deg');
    t.innerHTML=(IMGS[i]?`<img src="${IMGS[i]}" alt="">`:`<div class="ph">لوجو ${n}</div>`);
    g.appendChild(t);
  });
  document.getElementById('finale').classList.add('on');
  fireworkBurst(3);confettiRain(100);
  await sleep(1400);
  const lines=[...document.querySelectorAll('#message .line')];
  for(const l of lines){l.classList.add('in');await sleep(1100)}
  // احتفال هادي مستمر
  setInterval(()=>fireworkBurst(1),2600);
  setInterval(()=>confettiRain(22),4200);
  setInterval(()=>spawnBalloons(2),3500);
}

/* =====================================================
   البلالين
   ===================================================== */
function spawnBalloons(n){
  const box=document.getElementById('balloons');
  const cols=['#ff5fa2','#ffd166','#9b6bff','#5ee7ff','#7CFFB2','#ff8a5b'];
  for(let i=0;i<n;i++){
    const b=document.createElement('div');b.className='balloon';
    b.style.left=Math.random()*94+'%';b.style.background=cols[Math.random()*cols.length|0];
    b.style.setProperty('--dx',(Math.random()*120-60)+'px');
    b.style.animationDuration=(8+Math.random()*7)+'s';b.style.animationDelay=(Math.random()*1.2)+'s';
    const sc=.7+Math.random()*.7;b.style.width=58*sc+'px';b.style.height=74*sc+'px';
    b.innerHTML='<i></i>';box.appendChild(b);
    setTimeout(()=>b.remove(),17000);
  }
}

/* =====================================================
   ألعاب نارية + كونفيتي (Canvas)
   ===================================================== */
const fx=document.getElementById('fx'),cx=fx.getContext('2d');
let FW,FH,rockets=[],sparks=[],confetti=[],fxOn=false;
function rsz(){FW=fx.width=innerWidth;FH=fx.height=innerHeight}
addEventListener('resize',rsz);rsz();
const PAL=['#ff5fa2','#ffd166','#9b6bff','#5ee7ff','#7CFFB2','#ff8a5b','#ffffff'];

function fireworkBurst(n){
  for(let i=0;i<n;i++)setTimeout(()=>{
    rockets.push({x:FW*(.15+Math.random()*.7),y:FH,ty:FH*(.12+Math.random()*.35),vy:-(9+Math.random()*4),c:PAL[Math.random()*PAL.length|0]});
  },i*260);
}
function explode(x,y,c){
  const n=70+Math.random()*40|0, ring=Math.random()<.4;
  for(let i=0;i<n;i++){
    const a=Math.PI*2*i/n,sp=ring?5:(1.5+Math.random()*5.5);
    sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,d:.012+Math.random()*.012,c:Math.random()<.3?'#fff':c,r:1.5+Math.random()*1.8});
  }
}
function confettiRain(n){
  for(let i=0;i<n;i++){
    confetti.push({x:Math.random()*FW,y:-20-Math.random()*FH*.4,w:6+Math.random()*7,h:10+Math.random()*9,
      vy:2+Math.random()*3.5,vx:Math.random()*2-1,rot:Math.random()*6.28,vr:(Math.random()-.5)*.25,c:PAL[Math.random()*PAL.length|0],sw:Math.random()*6.28});
  }
}
function startFX(){if(fxOn)return;fxOn=true;loop()}
function loop(){
  cx.globalCompositeOperation='destination-out';cx.fillStyle='rgba(0,0,0,.22)';cx.fillRect(0,0,FW,FH);
  cx.globalCompositeOperation='lighter';
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];r.y+=r.vy;r.vy*=.985;
    cx.fillStyle=r.c;cx.beginPath();cx.arc(r.x,r.y,2.4,0,6.28);cx.fill();
    if(r.y<=r.ty||r.vy>-1.5){explode(r.x,r.y,r.c);rockets.splice(i,1)}
  }
  for(let i=sparks.length-1;i>=0;i--){
    const p=sparks[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.life-=p.d;
    if(p.life<=0){sparks.splice(i,1);continue}
    cx.globalAlpha=p.life;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fill();
  }
  cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  for(let i=confetti.length-1;i>=0;i--){
    const p=confetti[i];p.sw+=.05;p.x+=p.vx+Math.sin(p.sw)*.8;p.y+=p.vy;p.rot+=p.vr;
    if(p.y>FH+30){confetti.splice(i,1);continue}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.scale(1,Math.abs(Math.cos(p.sw)));
    cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
  }
  requestAnimationFrame(loop);
}
</script>
